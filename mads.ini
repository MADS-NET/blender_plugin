[agents]
# Settings shared by all agents
frontend_address = "tcp://localhost:9090"
backend_address = "tcp://localhost:9091"
settings_address = "tcp://localhost:9092"
timecode_fps = 25
# Outgoing payload encoding, fleet-wide default (can be overridden per agent).
#   wire_format: "json" (default) or "msgpack"
#   compression: "auto" (default, compress only frames >= 256 B), "snappy"
#                (always) or "none"
# wire_format = "json"
# compression = "auto"
# Transport to the broker (can be overridden per agent, and by --transport):
# "auto" uses the broker's ipc:// endpoints when it runs on this host, tcp
# otherwise; "tcp" always uses the addresses above; "ipc" fails if ipc is
# not available.
# transport = "auto"

#  __  __                   _ _ _   _     _      
# |  \/  | ___  _ __   ___ | (_) |_| |__ (_) ___ 
# | |\/| |/ _ \| '_ \ / _ \| | | __| '_ \| |/ __|
# | |  | | (_) | | | | (_) | | | |_| | | | | (__ 
# |_|  |_|\___/|_| |_|\___/|_|_|\__|_| |_|_|\___|
#                                                
[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"
prefer_loopback_for_local_services = true
# The followings are only needed if using CURVE encryption
# auth_verbose = false
# ip_whitelist = ["127.0.0.1"] # default is empty (allow all)
# Local transport: the three sockets are also bound on ipc:// endpoints
# (socket files under ipc_dir, named after the tcp port, e.g.
# broker-9090-front.ipc), and agents on this host use them instead of
# loopback tcp. ipc_dir defaults to $XDG_RUNTIME_DIR/mads or /tmp/mads-<uid>
# (%LOCALAPPDATA%\mads\run on Windows); *_ipc set an endpoint explicitly.
# ip_whitelist does not apply to ipc peers: the owner-only ipc_dir is their
# access control (CURVE still applies when enabled).
# ipc = true
# ipc_dir = "/tmp/mads-1000"
# frontend_ipc = "ipc:///tmp/mads-1000/front.ipc"
# backend_ipc = "ipc:///tmp/mads-1000/back.ipc"
# settings_ipc = "ipc:///tmp/mads-1000/settings.ipc"
# Kernel buffers of the ipc endpoints (default 1 MiB, 0 = OS default; the
# OS default for Unix sockets, 8 KiB on macOS, throttles large messages)
# ipc_sndbuf = 1048576
# ipc_rcvbuf = 1048576
# Remote editing of this settings file (the editor's "Open broker settings"
# panel). Off by default. When on, the broker serves the file on an ipc://
# endpoint (this host only, owner-only like the ipc above) and on a tcp one
# with --crypto (CURVE, editor keys *.pub in editors_dir, default
# <keys_dir>/editors) and/or an editing password (edit_password_file, below).
# Every save keeps a timestamped backup next to the file. See `man mads-broker`.
# remote_edit = false
# edit_address = "tcp://*:9094"
# editors_dir = "/usr/local/etc/editors"
# edit_ipc = "ipc:///tmp/mads-1000/edit.ipc"
# edit_backups = 10
# Password verifier (created with `mads ini --set-password`, owner-only, read at
# startup). With it tcp editing works also without --crypto (then in clear:
# development/trusted networks only) and, with --crypto, becomes a second
# factor (bus keys may then edit if editors_dir has no keys).
# edit_password_file = "/usr/local/etc/mads.ini.edit_password"

[metadata]
#@ pos=91,43
# Topic to publish to (single string!)
pub_topic = "metadata"

[perf_assess]
#@ pos=38,148
pub_topic = "perf_assess"

[blender]
#@ type=sink pos=365,234
# sub_topic = [""]
sub_topic = ["signals", "blender"]

[signals]
#@ type=source pos=49,322
period = 16 # ms, loop period: the sampling rate is its reciprocal
seed = 20260909 # optional, for reproducible noise
nest = "" # "" publishes the values flat, a name nests them
track_period = true # follow the call period actually observed
epoch = 0 # non-zero unix-s epoch: enables synchro generation
f0 = 0.25 # any extra key is usable in expressions, as "$f0"
sub_topic = []

# one table per signal, named after the field it feeds
[signals.signals.temperature]
type = "sine"
frequency = "$f0"       # Hz
amplitude = 10.0
offset = 25.0
snr_db = 30             # intrinsic noise, in dB; omit for the 40 dB default

[signals.signals.pressure]
type = "composite"
op = "sum"
components = [
  { type = "square", frequency = "$f0 / 5", amplitude = 0.5, offset = 3.0, noiseless = true },
  { type = "white_noise", sigma = 0.02 }
]

# an array of tables packs its signals into one JSON array, in order:
# {"position": [x, y, z]}
[[signals.signals.position]]
type = "sine"
frequency = "$f0"
amplitude = 1.0

[[signals.signals.position]]
type = "sine"
frequency = "$f0"
phase = 1.5707963

[[signals.signals.position]]
type = "sine"
frequency = "$f0 / 5"
amplitude = 2
